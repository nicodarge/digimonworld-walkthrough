# Run: pre-commit install. The commit stage fixes and guards; CI runs the `manual` stage (pre-commit run --all-files --hook-stage manual).
default_stages: [pre-commit]
exclude: '^(id2|images|screenshots|design|css|js|Download)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # fr/, en/ and the fragments are generated by tools/build.py — leave them
      # untouched so the generator stays the single source of formatting.
      - id: trailing-whitespace
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
        stages: [pre-commit]
      - id: check-yaml
        stages: [manual]
      - id: check-merge-conflict
        # Vacuous in CI without it: a checkout is not a merge in progress
        args: [--assume-in-merge]
        stages: [pre-commit, manual]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        files: '\.md$'
        stages: [manual]

  - repo: local
    hooks:
      - id: build-site
        name: regenerate site from sources
        entry: python3 tools/build.py
        language: python
        additional_dependencies: [beautifulsoup4, lxml]
        pass_filenames: false
        # enhance.py is imported by build.py and does most of the markup work,
        # so a commit touching only it changes the output too. Left out, the
        # staleness surfaces in CI's reproducibility gate instead of here,
        # which is the gap this hook exists to close.
        files: '^(tools/(build|enhance)\.py|sources/)'
        stages: [pre-commit]
