# Run: pre-commit install   then   pre-commit run --all-files
exclude: '^(id2|images|screenshots|design|css|js|Download)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # fr/, en/ and the fragments are generated by tools/build.py — leave them
      # untouched so the generator stays the single source of formatting.
      - id: trailing-whitespace
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
      - id: end-of-file-fixer
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        files: '\.md$'

  - repo: local
    hooks:
      - id: build-site
        name: regenerate site from sources
        entry: python3 tools/build.py
        language: python
        additional_dependencies: [beautifulsoup4, lxml]
        pass_filenames: false
        # enhance.py is imported by build.py and does most of the markup work,
        # so a commit touching only it changes the output too. Left out, the
        # staleness surfaces in CI's reproducibility gate instead of here,
        # which is the gap this hook exists to close.
        files: '^(tools/(build|enhance)\.py|sources/)'

      - id: verify-site
        name: verify site (links, assets, i18n parity)
        entry: python3 tools/verify.py
        language: python
        additional_dependencies: [beautifulsoup4, lxml]
        pass_filenames: false
        always_run: true

      - id: tests
        name: tests (transforms, and every verify check fed what it must refuse)
        entry: python3 -m pytest tests/ -q
        language: python
        additional_dependencies: [beautifulsoup4, lxml, pytest]
        pass_filenames: false
        always_run: true
