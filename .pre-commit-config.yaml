# Run: pre-commit install   then   pre-commit run --all-files
exclude: '^(id2|images|screenshots|design|css|js|Download)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # fr/, en/ and the fragments are generated by tools/build.py — leave them
      # untouched so the generator stays the single source of formatting.
      - id: trailing-whitespace
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
      - id: end-of-file-fixer
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(fr/|en/|index\.html|sources/fragments/)'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        files: '\.md$'

  - repo: local
    hooks:
      - id: build-site
        name: regenerate site from sources
        entry: python3 tools/build.py
        language: python
        additional_dependencies: [beautifulsoup4, lxml]
        pass_filenames: false
        files: '^(tools/build\.py|sources/)'

      - id: verify-site
        name: verify site (links, assets, i18n parity)
        entry: python3 tools/verify.py
        language: python
        additional_dependencies: [beautifulsoup4, lxml]
        pass_filenames: false
        always_run: true
