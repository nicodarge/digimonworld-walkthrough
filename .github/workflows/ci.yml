name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r tools/requirements.txt

      - name: Build is reproducible from sources
        run: |
          python tools/build.py
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'python tools/build.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Verify site (HTML, links, assets, i18n parity)
        run: python tools/verify.py
