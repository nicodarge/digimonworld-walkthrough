name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install build dependencies
        run: pip install -r tools/requirements.txt

      - name: Build is reproducible from sources
        run: |
          python tools/build.py
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'python tools/build.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Verify site (HTML, links, assets, i18n parity)
        run: python tools/verify.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: pip install -r tools/requirements-dev.txt

      # Unit tests over the build's own transforms, plus fault injection
      # against every verify.py check: each one is fed the input it exists to
      # refuse and must fail on it. A check that only ever sees valid input
      # proves nothing.
      - name: Tests
        run: pytest tests/ -q

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs every hook at the revs in .pre-commit-config.yaml, so a Renovate
      # bump of a hook is exercised before Renovate merges it.
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
