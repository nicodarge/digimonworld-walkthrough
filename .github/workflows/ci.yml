name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install build dependencies
        run: pip install -r tools/requirements.txt

      - name: Build is reproducible from sources
        run: |
          python tools/build.py
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'python tools/build.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Verify site (HTML, links, assets, i18n parity)
        run: python tools/verify.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: pip install -r tools/requirements-dev.txt

      # Unit tests over the build's own transforms, plus fault injection
      # against every verify.py check: each one is fed the input it exists to
      # refuse and must fail on it. A check that only ever sees valid input
      # proves nothing.
      - name: Tests
        run: pytest tests/ -q

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Runs the verifying hooks (`stages: [manual]`) and the guards
      # (`stages: [pre-commit, manual]`) at the revs in .pre-commit-config.yaml,
      # so a Renovate bump of a hook is exercised before Renovate merges it. The
      # fixers that run at commit are not re-run here.
      - name: pre-commit
        env:
          # renovate: datasource=pypi depName=pre-commit
          PRE_COMMIT_VERSION: 4.7.0
        run: |
          pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  # One check for branch protection to require. Without it, protection has to name
  # every job above and silently stops covering a job added later.
  gate:
    runs-on: ubuntu-latest
    needs: [verify, test, pre-commit]
    if: always()
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required check did not pass" >&2
              exit 1
            fi
          done
